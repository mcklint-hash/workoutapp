<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Min Träning 9.3.1</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="brand">MT</div><h1>Min Träning</h1>
<button class="nav active" data-view="home">Startsida</button>
<button class="nav" data-view="programs">Upplägg</button>
<button class="nav" data-view="workout">Starta pass</button>
<button class="nav" data-view="library">Övningsbank</button>
<button class="nav" data-view="history">Historik</button>
<button class="nav" data-view="stats">Statistik</button>
<button class="nav" data-view="settings">Inställningar</button>
<p class="version">Version 9.3.1</p>
</aside>
<main>
<section id="home" class="view active">
<div class="card hero"><div><span class="pill">VERSION 9.3.1</span><h2 id="todayTitle">Välj ett upplägg</h2><p id="todaySub"></p><div id="todayExercises"></div><button id="startFromHome">Starta dagens pass</button></div><div class="summary"><div><small>Genomförda pass</small><strong id="workoutCount">0</strong></div><div><small>Egna upplägg</small><strong id="customCount">0</strong></div></div></div>
</section>
<section id="programs" class="view"><h2>Upplägg</h2><div id="programList" class="cards"></div>
<div class="card"><h3>Skapa eller redigera eget upplägg</h3><form id="programSetup" class="form">
<label>Namn<input id="programName" required></label>
<label>Pass per vecka<select id="frequency"><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option></select></label>
<label>Veckor<select id="weeks"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label>
<button>Skapa passmallar</button><button type="button" id="cancelEdit" class="secondary hidden">Avbryt</button></form>
<form id="programBuilder" class="hidden"><div id="builderDays"></div><button>Spara upplägg</button></form></div></section>
<section id="workout" class="view"><h2>Träningspass</h2><div class="card"><div id="workoutInfo" class="notice"></div><div class="buttonRow"><button id="startWorkout">Starta dagens pass</button><button id="resetWorkout" class="secondary">Avsluta pågående pass</button></div>
<div id="runner" class="hidden"><h3 id="exerciseTitle"></h3><p id="exerciseStep"></p><div class="two"><div class="panel"><h4>Senaste resultat</h4><div id="lastResult"></div></div><div class="panel"><h4>Rekommenderat</h4><div id="recommended"></div></div></div><p id="coach" class="notice"></p>
<form id="setForm" class="form"><label>Vikt<input id="weight" type="number" step="0.5" required></label><label>Reps<input id="reps" type="number" required></label><label id="failureLabel" class="check hidden"><input id="failure" type="checkbox"> Failure-set</label><button type="button" id="fillRecommendation" class="secondary">Fyll rekommendation</button><button>Spara set</button></form><div id="loggedSets"></div></div></div></section>
<section id="library" class="view"><h2>Övningsbank</h2><div class="card"><form id="exerciseForm" class="form"><label>Övning<input id="exerciseName" required></label><label>Muskelgrupp<select id="muscle"><option>Bröst</option><option>Rygg</option><option>Ben</option><option>Axlar</option><option>Armar</option><option>Mage</option></select></label><button>Lägg till</button></form></div><div class="card"><input id="exerciseSearch" placeholder="Sök övning"><div id="exerciseList" class="cards"></div></div></section>
<section id="history" class="view"><h2>Historik</h2><div class="card"><button id="clearHistory" class="danger">Rensa historik</button><div id="historyList"></div></div></section>
<section id="stats" class="view"><h2>Statistik</h2><div class="card"><label>Period<select id="statsRange"><option value="30">30 dagar</option><option value="90" selected>90 dagar</option><option value="365">1 år</option><option value="all">Sedan start</option></select></label><h3>Övningar</h3><div id="exerciseStats"></div><h3>Muskelgrupper</h3><div id="muscleStats"></div></div></section>
<section id="settings" class="view"><h2>Inställningar</h2><div class="card form"><label>Viktavrundning<select id="rounding"><option value="0.5">0,5 kg</option><option value="1.25">1,25 kg</option><option value="2.5" selected>2,5 kg</option><option value="5">5 kg</option></select></label><label>Ökning vid 7+ reps<select id="increasePercent"><option value="2.5">2,5 %</option><option value="5" selected>5 %</option><option value="7.5">7,5 %</option><option value="10">10 %</option></select></label></div><div class="card"><div class="buttonRow"><button id="exportData">Exportera data</button><label class="upload">Importera data<input id="importData" hidden type="file" accept=".json"></label></div><p id="settingsMessage"></p></div></section>
</main></div>
<script src="app.js"></script>
</body></html>
